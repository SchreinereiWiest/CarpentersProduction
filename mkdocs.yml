site_name: CarpentersProduction
site_description: Technische Dokumentation von CarpentersProduction
docs_dir: docs
site_dir: site
dev_addr: 0.0.0.0:8000

theme:
  name: material
  language: de
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Farbschema wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Zum hellen Farbschema wechseln

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start: index.md
  - Architektur: architecture/index.md
  - Frontend:
      - Überblick: frontend/index.md
      - Installation & Entwicklung: frontend/installation.md
      - Routing & Authentifizierung: frontend/routing-auth.md
      - State, API & Cache: frontend/state-data.md
      - Seiten & Komponenten: frontend/pages-components.md
      - Projektmodule: frontend/project-modules.md
      - Management & Betriebskalkulation: frontend/management.md
      - Funktionsreferenz: frontend/functions.md
      - Risiken & Qualitätsregeln: frontend/quality.md
  - Management:
      - Überblick: management/index.md
      - Betrieb einrichten:
          - 01 Betrieb & Geschäftsjahr: management/setup/business.md
          - 02 Vermögen & Finanzierung: management/setup/assets.md
          - 03 Jährliche Betriebskosten: management/setup/annual-costs.md
          - 04 Mitarbeiter & Arbeitsstunden: management/setup/hours.md
          - 05 Kostenstellenverteilung: management/setup/distribution.md
          - 06 Maschinenkostenrechnung: management/setup/machines.md
          - 07 BAB & Vollkostenkalkulation: management/setup/bab.md
          - 08 Prüfung & Freigabe: management/setup/review.md
      - Jahresbetrieb:
          - Betriebsübersicht: management/operating/overview.md
          - Stunden & Produktivität: management/operating/hours.md
          - Kostenstellen & Vorjahresvergleich: management/operating/costs.md
      - Dokumente & CSV-Import: management/documents-import.md
      - Architektur & Dateien: management/architecture.md
      - Vorgaben & Defaultfabriken: management/defaults.md
      - API & Speicherung: management/api.md
      - Funktionsreferenz: management/functions.md
      - Tests & Entwicklung: management/testing.md
  - Backend:
      - Überblick: backend/index.md
      - Installation & Konfiguration: backend/installation.md
      - API-Referenz: backend/api.md
      - Authentifizierung: backend/authentication.md
      - Lizenzierung: backend/licensing.md
      - Kunden: backend/customers.md
      - Projekte & Archive: backend/projects.md
      - Zeiterfassung: backend/time-tracking.md
      - Benutzer: backend/users.md
      - Dateien, Material & Einstellungen: backend/files-storage-settings.md
      - Funktionsreferenz: backend/functions.md
      - Sicherheit & bekannte Risiken: backend/security.md
  - Datenbank: database/index.md
  - Module: modules/index.md
  - Infrastruktur: infrastructure/index.md
  - Betrieb: operations/index.md
  - Tests: testing/index.md

copyright: Dokumentation für CarpentersProduction
