site_name: CarpentersProduction
site_description: Technische Dokumentation von CarpentersProduction
docs_dir: docs
site_dir: site
dev_addr: 0.0.0.0:8000

theme:
  name: material
  language: de
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Farbschema wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Zum hellen Farbschema wechseln

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start: index.md
  - Architektur: architecture/index.md
  - Frontend: frontend/index.md
  - Backend:
      - Überblick: backend/index.md
      - Installation & Konfiguration: backend/installation.md
      - API-Referenz: backend/api.md
      - Authentifizierung: backend/authentication.md
      - Kunden: backend/customers.md
      - Projekte & Archive: backend/projects.md
      - Zeiterfassung: backend/time-tracking.md
      - Benutzer: backend/users.md
      - Dateien, Material & Einstellungen: backend/files-storage-settings.md
      - Funktionsreferenz: backend/functions.md
      - Sicherheit & bekannte Risiken: backend/security.md
  - Datenbank: database/index.md
  - Module: modules/index.md
  - Infrastruktur: infrastructure/index.md
  - Betrieb: operations/index.md
  - Tests: testing/index.md

copyright: Dokumentation für CarpentersProduction
