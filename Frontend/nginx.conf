worker_processes auto;
pid /dev/shm/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;

    # /dev/shm is writable even when Kubernetes mounts the image filesystem
    # read-only. These paths also cover larger proxied request/response bodies.
    client_body_temp_path /dev/shm/client_temp;
    proxy_temp_path /dev/shm/proxy_temp;
    fastcgi_temp_path /dev/shm/fastcgi_temp;
    uwsgi_temp_path /dev/shm/uwsgi_temp;
    scgi_temp_path /dev/shm/scgi_temp;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location ^~ /api/ {
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Worker und HTML duerfen keine alte Asset-Liste dauerhaft
        # festhalten. Gehashte Build-Assets selbst sind dagegen unveraenderlich.
        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # Modul-Worker muessen mit einem JavaScript-MIME-Type und bei fehlender
        # Datei mit 404 statt mit dem SPA-Fallback ausgeliefert werden.
        location ~* \.mjs$ {
            default_type application/javascript;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
