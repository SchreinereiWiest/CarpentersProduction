services:
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=carpenters-proxy
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      carpenters-proxy:
        aliases:
          - storage.localhost

  carpenters-frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      additional_contexts:
        engine: ./Engine

    restart: always

    environment:
      - NODE_ENV=${NODE_ENV:-development}

    volumes:
      - ./Frontend:/app
      - ./Engine:/Engine:ro
      - /app/node_modules

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=carpenters-proxy"
      - "traefik.http.routers.carpenters-frontend.rule=Host(`av.localhost`)"
      - "traefik.http.routers.carpenters-frontend.priority=1"
      - "traefik.http.routers.carpenters-frontend.entrypoints=web"
      - "traefik.http.routers.carpenters-frontend.service=carpenters-frontend"
      - "traefik.http.services.carpenters-frontend.loadbalancer.server.port=5173"

    networks:
      - carpenters-network
      - carpenters-proxy
 
  backendjs:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      additional_contexts:
        engine: ./Engine

    restart: always

    env_file:
    - ./Backend/.env

    environment:
      - NODE_ENV=development
      - VALKEY_URL=redis://valkey:6379/0
      - MEASUREMENT_OCR_SECRET=${MEASUREMENT_OCR_SECRET:?MEASUREMENT_OCR_SECRET muss in der root .env gesetzt sein}
      - MEASUREMENT_OCR_RESOLVE_URL=http://backendjs:5000/api/internal/measurement-ocr/resolve
      - MEASUREMENT_OCR_CALLBACK_URL=http://backendjs:5000/api/internal/measurement-ocr/result

    # Ermöglicht dem Backend-Container den Zugriff auf eine auf demselben
    # Linux-Host laufende Open-WebUI-Instanz (z. B. Port 3000).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=carpenters-proxy"
      - "traefik.http.routers.carpenters-backend.rule=Host(`av.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.carpenters-backend.priority=100"
      - "traefik.http.routers.carpenters-backend.entrypoints=web"
      - "traefik.http.routers.carpenters-backend.service=carpenters-backend"
      - "traefik.http.services.carpenters-backend.loadbalancer.server.port=5000"

    depends_on:
      - carpenters-postgres
      - garage
      - carpenters-valkey

    networks:
      - carpenters-network
      - MoebelDesign
      - carpenters-proxy

  carpenters-valkey:
    image: valkey/valkey:8-alpine
    restart: always
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - measurement-ocr-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      carpenters-network:
        aliases:
          - valkey

  measurement-ocr:
    build:
      context: ./Services/MeasurementOCR
      dockerfile: Dockerfile
    restart: always
    environment:
      - VALKEY_URL=redis://valkey:6379/0
      - MEASUREMENT_OCR_QUEUE=measurement:ocr:jobs
      - MEASUREMENT_OCR_SECRET=${MEASUREMENT_OCR_SECRET:?MEASUREMENT_OCR_SECRET muss in der root .env gesetzt sein}
      - MEASUREMENT_OCR_MAX_PAGES=${MEASUREMENT_OCR_MAX_PAGES:-50}
      - LOG_LEVEL=${MEASUREMENT_OCR_LOG_LEVEL:-INFO}
    depends_on:
      carpenters-valkey:
        condition: service_healthy
      backendjs:
        condition: service_started
    networks:
      - carpenters-network

  documentation:
    build:
      context: .
      dockerfile: Dockerfile.docs

    restart: always

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=carpenters-proxy"
      - "traefik.http.routers.carpenters-documentation.rule=Host(`docs.localhost`)"
      - "traefik.http.routers.carpenters-documentation.entrypoints=web"
      - "traefik.http.routers.carpenters-documentation.service=carpenters-documentation"
      - "traefik.http.services.carpenters-documentation.loadbalancer.server.port=80"

    networks:
      - carpenters-network
      - carpenters-proxy

  carpenters-postgres:
    image: postgres:16

    container_name: postgresql

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpenters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der root .env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-carpentersproduction}

    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      carpenters-network:
        aliases:
          - postgres

  garage:
    image: dxflrs/garage:v2.3.0
    
    restart: always

    volumes:
      - ./infra/garage/config/garage.toml:/etc/garage.toml
      - ./infra/garage/meta:/var/lib/garage/meta
      - ./infra/garage/data:/var/lib/garage/data

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=carpenters-proxy"
      - "traefik.http.routers.carpenters-garage.rule=Host(`storage.localhost`)"
      - "traefik.http.routers.carpenters-garage.priority=50"
      - "traefik.http.routers.carpenters-garage.entrypoints=web"
      - "traefik.http.routers.carpenters-garage.service=carpenters-garage"
      - "traefik.http.routers.carpenters-garage.middlewares=carpenters-storage-cors"
      - "traefik.http.middlewares.carpenters-storage-cors.headers.accesscontrolallowmethods=GET,PUT,HEAD,OPTIONS"
      - "traefik.http.middlewares.carpenters-storage-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.carpenters-storage-cors.headers.accesscontrolalloworiginlist=http://av.localhost,http://app.localhost,http://suite.localhost,http://localhost:5173,http://10.10.100.52"
      - "traefik.http.middlewares.carpenters-storage-cors.headers.accesscontrolexposeheaders=ETag,Content-Length,Content-Type,Last-Modified"
      - "traefik.http.middlewares.carpenters-storage-cors.headers.addvaryheader=true"
      - "traefik.http.services.carpenters-garage.loadbalancer.server.port=3900"



    networks:
      carpenters-network: {}
      carpenters-proxy: {}

networks:
  carpenters-network:
    driver: bridge
  carpenters-proxy:
    name: carpenters-proxy
    external: true
  MoebelDesign:
    name: MoebelDesign
    external: true

volumes:
  measurement-ocr-valkey:
    name: carpentersproduction_measurement-ocr-valkey
