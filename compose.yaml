services:

  traefik:
    image: traefik:v3.0
    container_name: traefik

    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"

      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"


    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - carpenters-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      additional_contexts:
        engine: ./Engine

    restart: always

    environment:
      - NODE_ENV=${NODE_ENV:-development}

    volumes:
      - ./Frontend:/app
      - ./Engine:/Engine:ro
      - /app/node_modules

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.frontend.rule=Host(`10.10.100.52`) && PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"   
      - "traefik.http.routers.frontend.entrypoints=web"

      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

    networks:
      - carpenters-network
 
  backendjs:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      additional_contexts:
        engine: ./Engine

    restart: always

    env_file:
    - ./Backend/.env

    environment:
      - NODE_ENV=development
      - VALKEY_URL=redis://valkey:6379/0
      - MEASUREMENT_OCR_SECRET=${MEASUREMENT_OCR_SECRET:?MEASUREMENT_OCR_SECRET muss in der root .env gesetzt sein}
      - MEASUREMENT_OCR_RESOLVE_URL=http://backendjs:5000/api/internal/measurement-ocr/resolve
      - MEASUREMENT_OCR_CALLBACK_URL=http://backendjs:5000/api/internal/measurement-ocr/result

    # Ermöglicht dem Backend-Container den Zugriff auf eine auf demselben
    # Linux-Host laufende Open-WebUI-Instanz (z. B. Port 3000).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    labels:
      - "traefik.enable=true"
      # Das Backend hängt zusätzlich im Lizenznetz. Ohne diese Festlegung kann
      # Traefik dessen für ihn unerreichbare MoebelDesign-IP wählen (HTTP 504).
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME:-carpentersproduction}_carpenters-network"

      - "traefik.http.routers.backend.rule=Host(`10.10.100.52`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend.entrypoints=web"

      - "traefik.http.services.backend.loadbalancer.server.port=5000"

    depends_on:
      - postgres
      - garage
      - valkey

    networks:
      - carpenters-network
      - MoebelDesign

  valkey:
    image: valkey/valkey:8-alpine
    restart: always
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - measurement-ocr-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - carpenters-network

  measurement-ocr:
    build:
      context: ./Services/MeasurementOCR
      dockerfile: Dockerfile
    restart: always
    environment:
      - VALKEY_URL=redis://valkey:6379/0
      - MEASUREMENT_OCR_QUEUE=measurement:ocr:jobs
      - MEASUREMENT_OCR_SECRET=${MEASUREMENT_OCR_SECRET:?MEASUREMENT_OCR_SECRET muss in der root .env gesetzt sein}
      - MEASUREMENT_OCR_MAX_PAGES=${MEASUREMENT_OCR_MAX_PAGES:-50}
      - LOG_LEVEL=${MEASUREMENT_OCR_LOG_LEVEL:-INFO}
    depends_on:
      valkey:
        condition: service_healthy
      backendjs:
        condition: service_started
    networks:
      - carpenters-network

  documentation:
    build:
      context: .
      dockerfile: Dockerfile.docs

    restart: always

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.documentation.rule=Host(`10.10.100.52`) && PathPrefix(`/docs/`)"
      - "traefik.http.routers.documentation.priority=110"
      - "traefik.http.routers.documentation.entrypoints=web"
      - "traefik.http.routers.documentation.middlewares=documentation-strip"

      - "traefik.http.routers.documentation-root.rule=Host(`10.10.100.52`) && Path(`/docs`)"
      - "traefik.http.routers.documentation-root.priority=111"
      - "traefik.http.routers.documentation-root.entrypoints=web"
      - "traefik.http.routers.documentation-root.middlewares=documentation-add-slash"
      - "traefik.http.routers.documentation-root.service=documentation"

      - "traefik.http.middlewares.documentation-strip.stripprefix.prefixes=/docs"
      - "traefik.http.middlewares.documentation-add-slash.redirectregex.regex=^(.*)/docs$"
      - "traefik.http.middlewares.documentation-add-slash.redirectregex.replacement=$${1}/docs/"
      - "traefik.http.middlewares.documentation-add-slash.redirectregex.permanent=true"
      - "traefik.http.services.documentation.loadbalancer.server.port=80"

    networks:
      - carpenters-network

  postgres:
    image: postgres:16

    container_name: postgresql

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpenters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der root .env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-carpentersproduction}

    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - carpenters-network

  garage:
    image: dxflrs/garage:v2.3.0
    
    restart: always

    volumes:
      - ./infra/garage/config/garage.toml:/etc/garage.toml
      - ./infra/garage/meta:/var/lib/garage/meta
      - ./infra/garage/data:/var/lib/garage/data

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.garage.rule=Host(`10.10.100.52`) && PathPrefix(`/carpenters-storage`)"
      - "traefik.http.routers.garage.priority=50"
      - "traefik.http.routers.garage.entrypoints=web"

      - "traefik.http.services.garage.loadbalancer.server.port=3900"



    networks:
      - carpenters-network

networks:
  carpenters-network:
    driver: bridge
  MoebelDesign:
    name: MoebelDesign
    external: true

volumes:
  measurement-ocr-valkey:
